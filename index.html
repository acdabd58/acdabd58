<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welkite University - Student & Staff Portal Login</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Fallback background color + Background Image setup */
            background: linear-gradient(135deg, rgba(15, 32, 39, 0.8), rgba(32, 58, 67, 0.8), rgba(44, 83, 100, 0.8)), 
                        url('wku-bg.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #333;
        }

        /* Top Header Styling */
        header {
            background: rgba(11, 37, 69, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 3px solid #ffc107;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-container img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            background: white;
            border-radius: 50%;
            padding: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .brand-text h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .brand-text p {
            font-size: 0.8rem;
            color: #ffc107;
            font-weight: 500;
        }

        .header-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            margin-left: 20px;
            transition: color 0.3s ease;
        }

        .header-links a:hover {
            color: #ffc107;
        }

        /* Main Login Container */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 40px 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            font-size: 1.6rem;
            color: #0b2545;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 0.88rem;
            color: #666;
        }

        /* Form Inputs */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #0b2545;
            margin-bottom: 8px;
        }

        .input-field-wrapper {
            position: relative;
        }

        .input-field-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            font-size: 1rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            background: #f8fafc;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #0b2545;
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(11, 37, 69, 0.15);
        }

        /* Extra Options (Remember me & Forgot pass) */
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            cursor: pointer;
        }

        .remember-me input {
            accent-color: #0b2545;
            width: 16px;
            height: 16px;
        }

        .forgot-pass {
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-pass:hover {
            text-decoration: underline;
        }

        /* Submit Button */
        .login-btn {
            width: 100%;
            padding: 13px;
            background: #0b2545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(11, 37, 69, 0.3);
        }

        .login-btn:hover {
            background: #133863;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        /* Error Message Banner */
        .error-message {
            background: #fee2e2;
            border: 1px solid #f87171;
            color: #b91c1c;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        /* Footer Info */
        footer {
            background: rgba(11, 37, 69, 0.9);
            color: #cbd5e1;
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            backdrop-filter: blur(5px);
        }

        footer span {
            color: #ffc107;
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media(max-width: 480px) {
            .login-card {
                padding: 25px;
            }
            .brand-text h1 {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="brand-container">
            <!-- Replace wku-logo.png with your actual logo file name -->
            <img src="wku-logo.png" alt="Welkite University Logo" onerror="this.src='https://via.placeholder.com/55?text=WKU'">
            <div class="brand-text">
                <h1>WELKITE UNIVERSITY</h1>
                <p>Management Information System (WKU-MIS)</p>
            </div>
        </div>
        <div class="header-links">
            <a href="https://www.wku.edu.et" target="_blank"><i class="fa-solid fa-globe"></i> Main Website</a>
        </div>
    </header>

    <!-- Center Login Section -->
    <div class="main-content">
        <div class="login-card">
            <div class="login-header">
                <h2>Portal Login</h2>
                <p>Enter your credentials to access your account</p>
            </div>

            <!-- Error Banner -->
            <div id="errorBanner" class="error-message">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText">Invalid User ID or Password.</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">User ID / Student ID</label>
                    <div class="input-field-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="e.g. WKU/1234/14" required autocomplete="username">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-field-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                    <a href="#" class="forgot-pass" onclick="alert('Please contact the WKU ICT Directorate or Registrar office to reset your password.')">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn" id="submitBtn">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 <span>Welkite University</span> ICT Directorate. All Rights Reserved.
    </footer>

    <!-- JavaScript Validation & Handling -->
  <script src="script.js"></script>
    
</body>
</html>
